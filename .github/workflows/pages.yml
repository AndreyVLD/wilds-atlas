name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Read data.lock
        id: lock
        run: echo "sha=$(tr -d '[:space:]' < data.lock 2>/dev/null || true)" >> "$GITHUB_OUTPUT"
      - name: Check out the map data
        if: steps.lock.outputs.sha != ''
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.lock.outputs.sha }}
          path: web/public/maps
      - run: rm -rf web/public/maps/.git
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci && npm run build
        working-directory: web
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
